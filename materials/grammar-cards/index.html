* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--fg);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(70, 140, 200, .22), transparent 70%),
    radial-gradient(900px 500px at 100% 100%, rgba(30, 90, 140, .18), transparent 70%),
    var(--sea-0);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--sea-0);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- ヘッダー ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: linear-gradient(var(--sea-0) 70%, rgba(8, 19, 31, 0));
}
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 14px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 10px; background: var(--gold);
  display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(244, 195, 90, .18);
}

le": "比率"}, {"no": 31, "cat1": "空間", "cat2": "空間", "title": "場所の登録", "level": 3, "text": "手話表現をする場所を利用して対象概念を再利用すること。", "example": "ろう者への情報伝達"}, {"no": 32, "cat1": "手話表現", "cat2": "動詞", "title": "無変化動詞", "level": 1, "text": "文脈によらず形が変化しない動詞表現のこと。", "example": "動く"}, {"no": 33, "cat1": "手話表現", "cat2": "動詞", "title": "空間動詞", "level": 2, "text": "場所の情報を保持した動詞表現のこと。", "example": "行く/飛行機"}, {"no": 34, "cat1": "手話表現", "cat2": "動詞", "title": "一致動詞", "level": 2, "text": "関係する対象情報を保持した動詞表現のこと。", "example": "見る"}, {"no": 35, "cat1": "手話表現", "cat2": "動詞", "title": "自動詞的表現", "level": 3, "text": "目的語を必要としない動詞表現のこと。", "example": "私の傘が壊れた"}, {"no": 36, "cat1": "手話表現", "cat2": "動詞", "title": "他動詞的表現", "level": 3, "text": "目的語を取る動詞表現のこと。", "example": "私が傘を壊した"}, {"no": 37, "cat1": "手話表現", "cat2": "表し分け", "title": "状況に合わせた表現", "level": 3, "text": "状況に応じて手話表現を適切に使い分けること。", "example": "ない/見る/手話"}, {"no": 38, "cat1": "手話表現", "cat2": "程度", "title": "強弱", "level": 2, "text": "意味の強さを大きさや速度で表し分けること。", "example": "速い/雨"}, {"no": 39, "cat1": "手話表現", "cat2": "ろう語", "title": "ろう語", "level": 4, "text": "ろう者独特と言われる表現のこと。", "example": "PO"}, {"no": 40, "cat1": "手話表現", "cat2": "日本語借用語", "title": "日本語借用語", "level": 2, "text": "指文字などを取り入れた表現のこと。", "example": "カラオケ"}, {"no": 41, "cat1": "文構造", "cat2": "文構造", "title": "WH分裂文", "level": 3, "text": "対応するWH疑問詞を置いてから表現して強調すること。", "example": "企画のテーマは亀"}, {"no": 42, "cat1": "文構造", "cat2": "文構造", "title": "文末コピー", "level": 2, "text": "主題に対応するPTを文末で表現すること。", "example": "私が説明します"}, {"no": 43, "cat1": "文構造", "cat2": "文構造", "title": "文末コメント", "level": 4, "text": "文全体に伴う感情を帯びた単語を文末で表現すること。", "example": "いつも遅刻なんだから！"}, {"no": 44, "cat1": "文構造", "cat2": "文構造", "title": "指の代理表現", "level": 3, "text": "指を用いて文の構成要素を明示すること。", "example": "本日話したい内容は2つあります"}];
const CATS = {"NM": "#D9472B", "CL": "#B98200", "RS": "#6A4C9C", "PT": "#0E8C8C", "テンス・アスペクト": "#1F3B6E", "空間": "#3C8D4E", "手話表現": "#C23A6E", "文構造": "#46525E"};
const DECKS = Object.keys(CATS);
const STORE_KEY = "katsuo-cards-v1";
const $ = s => document.querySelector(s);

// ---------- 保存（この端末のブラウザだけ） ----------
const store = (() => {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
  return {
    learned: new Set(s.learned || []),
    best: s.best || 0,
    faceDown: !!s.faceDown,
    save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ learned: [...this.learned], best: this.best, faceDown: this.faceDown })); } catch (e) {}
    },
  };
})();

// ---------- カード描画 ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const ch = i => Math.round(((n >> i) & 255) * k).toString(16).padStart(2, "0");
  return "#" + ch(16) + ch(8) + ch(0);
}
function titleSize(t) {
  let u = 0;
  for (const ch of t) u += /[ -~]/.test(ch) ? (/[A-Z0-9]/.test(ch) ? 0.7 : 0.58) : 1;
  return Math.max(9, Math.min(16.8, 83 / u));
}
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
function label(c, hideCat2) {
  if (c.cat2 === c.cat1) return esc(c.cat1);
  return esc(c.cat1) + "＞" + (hideCat2 ? "？" : esc(c.cat2));
}

/* opts: { flipped, mystery（クイズ用に答えを伏せる）, tag（button/div） } */
function cardHTML(c, opts = {}) {
  const color = CATS[c.cat1];
  const tag = opts.tag || "button";
  const mys = opts.mystery;
  const mask = s => mys ? esc(s).split(esc(c.title)).join("＿＿") : esc(s);
  const title = mys ? "？？？" : esc(c.title);
  const size = mys ? 16.8 : titleSize(c.title);
  const longEx = c.example.length > 15;
  return `<${tag} class="card lv${c.level}${opts.flipped ? " flipped" : ""}" data-no="${c.no}" style="--c:${color};--d:${shade(color, .88)}"${tag === "button" ? ` aria-label="No.${c.no} ${esc(c.title)}"` : ""}>
    <div class="card-inner">
      <div class="face front">
        <div class="fblock">
          <div class="flabel"><span>${label(c, mys && c.cat2 === c.title)}</span><i></i></div>
          <div class="ftitle" style="font-size:${size.toFixed(2)}cqw">${title}</div>
          <div class="flevel">難易度<em></em><span>${stars(c.level)}</span></div>
        </div>
        <div class="fbody">
          <p class="ftext">${mask(c.text)}</p>
          <div class="fex"><span class="exl">例</span><p class="${longEx ? "long" : ""}">${mask(c.example)}</p></div>
          <div class="ffoot"><i></i><span>${String(c.no).padStart(2, "0")}</span></div>
        </div>
        ${c.level >= 4 && !mys ? `<div class="holo"></div><div class="rare">${c.level === 5 ? "SUPER RARE" : "RARE"}</div>` : ""}
      </div>
      <div class="face back"><div class="bbig"></div><div class="bframe"></div><div class="bmark"></div></div>
    </div>
  </${tag}>`;
}

// マウスで傾ける（ホロが光る）
function attachTilt(root) {
  root.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const card = e.target.closest(".card");
    if (!card || !root.contains(card)) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.classList.add("tilting");
    card.style.setProperty("--ry", ((x - .5) * 18).toFixed(1) + "deg");
    card.style.setProperty("--rx", ((.5 - y) * 14).toFixed(1) + "deg");
    card.style.setProperty("--mx", (x * 100).toFixed(0) + "%");
    card.style.setProperty("--my", (y * 100).toFixed(0) + "%");
  });
  root.addEventListener("pointerout", e => {
    const card = e.target.closest(".card");
    if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
    card.classList.remove("tilting");
    card.style.removeProperty("--rx"); card.style.removeProperty("--ry");
  });
}

// ---------- 図鑑 ----------
const state = { deck: null, levels: new Set(), q: "" };
// 裏向きの一覧でめくったカード（拡大表示や絞り込みのあとも表のまま保つ。「裏向きで並べる」を切り替えるとリセット）
const revealed = new Set();
const byNo = new Map(CARDS.map(c => [c.no, c]));

function filtered() {
  const q = state.q.trim().toLowerCase();
  return CARDS.filter(c =>
    (!state.deck || c.cat1 === state.deck) &&
    (!state.levels.size || state.levels.has(c.level)) &&
    (!q || [c.cat1, c.cat2, c.title, c.text, c.example].join(" ").toLowerCase().includes(q)));
}

function renderDecks() {
  const item = (key, name, color, list) => {
    const got = list.filter(c => store.learned.has(c.no)).length;
    return `<button class="deck" data-deck="${key ? esc(key) : ""}" aria-pressed="${state.deck === key}" ${color ? `style="--c:${color}"` : ""}>
      <div class="deck-mini${color ? "" : " all"}"></div>
      <div><strong>${esc(name)}</strong><span>${got} / ${list.length}</span></div></button>`;
  };
  $("#decks").innerHTML = item(null, "すべて", null, CARDS) +
    DECKS.map(d => item(d, d, CATS[d], CARDS.filter(c => c.cat1 === d))).join("");
}

function renderGrid() {
  const list = filtered();
  $("#count").textContent = `${list.length} 枚`;
  $("#grid").innerHTML = list.length
    ? list.map(c => `<div class="slot">${store.learned.has(c.no) ? '<span class="learned-badge" aria-label="覚えた">✓</span>' : ""}${cardHTML(c, { flipped: store.faceDown && !revealed.has(c.no) })}</div>`).join("")
    : `<div class="empty">条件に合うカードがないよ。絞り込みをゆるめてみてね。</div>`;
}

function renderMeter() {
  const n = store.learned.size;
  $("#learned-n").textContent = n;
  $("#learned-total").textContent = CARDS.length;
  $("#learned-bar").style.width = (n / CARDS.length * 100) + "%";
}

function renderAll() { renderDecks(); renderGrid(); renderMeter(); }

$("#stars").innerHTML = [1, 2, 3, 4, 5].map(n => `<button data-lv="${n}" aria-pressed="false" title="難易度${n}">★${n}</button>`).join("");
$("#stars").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const n = +b.dataset.lv;
  state.levels.has(n) ? state.levels.delete(n) : state.levels.add(n);
  b.setAttribute("aria-pressed", state.levels.has(n));
  renderGrid();
});
$("#decks").addEventListener("click", e => {
  const b = e.target.closest(".deck"); if (!b) return;
  state.deck = b.dataset.deck || null;
  renderDecks(); renderGrid();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
$("#facedown").setAttribute("aria-pressed", store.faceDown);
$("#facedown").addEventListener("click", e => {
  store.faceDown = !store.faceDown; store.save();
  revealed.clear();
  e.currentTarget.setAttribute("aria-pressed", store.faceDown);
  document.querySelectorAll("#grid .card").forEach(c => c.classList.toggle("flipped", store.faceDown));
});
$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  // 裏向きの一覧では、まずその場でめくる。表を向いているカードは拡大表示
  if (card.classList.contains("flipped")) { card.classList.remove("flipped"); revealed.add(+card.dataset.no); return; }
  const list = filtered();
  openModal(list, list.findIndex(c => c.no === +card.dataset.no), false);
});
attachTilt($("#grid"));

// ---------- 拡大表示 ----------
// draw: 「ひく」で開いたとき true。左右の矢印・スワイプで別のカードをランダムに引き直す
const modal = { list: [], i: 0, lastFocus: null, draw: false };
function showModalCard(flipped, anim) {
  const c = modal.list[modal.i];
  $("#stage-card").innerHTML = cardHTML(c, { flipped, tag: "div" });
  const card = $("#stage-card .card");
  if (anim) card.classList.add(anim);
  $("#m-pos").textContent = modal.list.length > 1 ? `${modal.i + 1} / ${modal.list.length}` : `No.${String(c.no).padStart(2, "0")}`;
  $("#m-learn").setAttribute("aria-pressed", store.learned.has(c.no));
  $("#prev").disabled = modal.draw ? filtered().length < 2 : modal.i === 0;
  $("#next").disabled = modal.draw ? filtered().length < 2 : modal.i === modal.list.length - 1;
}
function openModal(list, i, faceDown, anim, draw = false) {
  modal.list = list; modal.i = Math.max(0, i); modal.draw = draw;
  modal.lastFocus = document.activeElement;
  $("#modal-hint").textContent = draw ? "タップしてめくろう ・ ← → で別のカードをひく"
    : faceDown ? "タップしてめくろう" : "タップでめくる ・ ← → で移動";
  showModalCard(faceDown, anim);
  $("#modal").hidden = false;
  $("#m-flip").focus({ preventScroll: true });
}
function closeModal() {
  $("#modal").hidden = true;
  renderAll();
  if (modal.lastFocus) modal.lastFocus.focus({ preventScroll: true });
}
function flipModal() { $("#stage-card .card")?.classList.toggle("flipped"); }
function step(d) {
  if (modal.draw) {
    const pick = drawCard(modal.list[modal.i]?.no);
    if (!pick) return;
    modal.list = [pick]; modal.i = 0; showModalCard(true, "deal");
    return;
  }
  const j = modal.i + d;
  if (j < 0 || j >= modal.list.length) return;
  modal.i = j; showModalCard(false);
}
$("#modal-close").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
$("#m-flip").addEventListener("click", flipModal);
$("#m-learn").addEventListener("click", e => {
  const no = modal.list[modal.i].no;
  store.learned.has(no) ? store.learned.delete(no) : store.learned.add(no);
  store.save();
  e.currentTarget.setAttribute("aria-pressed", store.learned.has(no));
  renderMeter();
  const card = $("#stage-card .card");
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
});
// タップでめくる、横スワイプで移動
let swipe = null;
$("#stage-card").addEventListener("pointerdown", e => { swipe = { x: e.clientX, y: e.clientY }; });
$("#stage-card").addEventListener("pointerup", e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) flipModal();
});
attachTilt($("#stage-card"));
document.addEventListener("keydown", e => {
  if ($("#modal").hidden) return;
  if (e.key === "Escape") closeModal();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); flipModal(); }
});

// ひく: 絞り込み中のカードから、まだ覚えていないものを優先して1枚引く（exclude: 直前のカードは避ける）
function drawCard(exclude) {
  const list = filtered().filter(c => c.no !== exclude);
  if (!list.length) return null;
  const fresh = list.filter(c => !store.learned.has(c.no));
  const pool = fresh.length ? fresh : list;
  return pool[Math.floor(Math.random() * pool.length)];
}
$("#draw").addEventListener("click", () => {
  const pick = drawCard();
  if (!pick) return;
  openModal([pick], 0, true, "deal", true);
});

// ---------- クイズ ----------
const QN = 10;
const quiz = { decks: new Set(), qs: [], i: 0, results: [], streak: 0, answered: false };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function rank(n) {
  if (n === QN) return ["かつおマスター", "全問正解。文句なしの一本釣り！"];
  if (n >= 8) return ["一本釣り名人", "あと少しで満点。間違えたカードを見直そう。"];
  if (n >= 5) return ["カツオ漁師", "いい調子。図鑑で復習するともっと伸びるよ。"];
  if (n >= 3) return ["見習い漁師", "まずは気になるデッキから覚えていこう。"];
  return ["稚魚", "ここからぐんぐん育つところ。図鑑をめくってみよう。"];
}
function quizPool() { return CARDS.filter(c => !quiz.decks.size || quiz.decks.has(c.cat1)); }

function renderQuizIntro() {
  const pool = quizPool();
  const sample = shuffle(CARDS).slice(0, 3);
  $("#view-quiz").innerHTML = `
    <div class="quiz-intro">
      <div>
        <h2>この説明はどの文法？</h2>
        <p>カードの見出しが「？？？」で隠れているよ。説明文と例文を読んで、正しい文法を4つの中から選んでね。全${QN}問。</p>
        <div class="section-label">出題するデッキ（選ばなければ全部）</div>
        <div class="decks" id="quiz-decks">${DECKS.map(d => `<button class="deck" data-deck="${esc(d)}" aria-pressed="${quiz.decks.has(d)}" style="--c:${CATS[d]}"><div class="deck-mini"></div><div><strong>${esc(d)}</strong><span>${CARDS.filter(c => c.cat1 === d).length} 枚</span></div></button>`).join("")}</div>
        <div class="row" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <button class="btn primary" id="quiz-start" ${pool.length < 4 ? "disabled" : ""}>スタート（${pool.length}枚から出題）</button>
          <span class="best">ベスト <b>${store.best}</b> / ${QN}</span>
        </div>
      </div>
      <div class="fan" aria-hidden="true">${sample.map(c => cardHTML(c, { flipped: true, tag: "div" })).join("")}</div>
    </div>`;
  $("#quiz-decks").addEventListener("click", e => {
    const b = e.target.closest(".deck"); if (!b) return;
    const d = b.dataset.deck;
    quiz.decks.has(d) ? quiz.decks.delete(d) : quiz.decks.add(d);
    renderQuizIntro();
  });
  $("#quiz-start").addEventListener("click", startQuiz);
}

function startQuiz() {
  const pool = quizPool();
  // 出題カードが10枚未満のデッキでも10問出せるよう、足りない分は繰り返す
  let qs = [];
  while (qs.length < QN) qs = qs.concat(shuffle(pool));
  quiz.qs = qs.slice(0, QN).map(c => {
    const same = shuffle(CARDS.filter(o => o.no !== c.no && o.cat1 === c.cat1 && o.title !== c.title));
    const other = shuffle(CARDS.filter(o => o.cat1 !== c.cat1 && o.title !== c.title));
    const wrong = [...same.slice(0, 2), ...other].filter((o, i, a) => a.findIndex(x => x.title === o.title) === i).slice(0, 3);
    return { card: c, choices: shuffle([c, ...wrong]) };
  });
  quiz.i = 0; quiz.results = []; quiz.streak = 0;
  renderQuestion();
}

function renderQuestion() {
  const { card, choices } = quiz.qs[quiz.i];
  quiz.answered = false;
  $("#view-quiz").innerHTML = `
    <div class="q-head">
      <div class="dots">${quiz.qs.map((_, k) => `<i class="${k < quiz.i ? (quiz.results[k] ? "ok" : "ng") : k === quiz.i ? "now" : ""}"></i>`).join("")}</div>
      <span class="best">第 ${quiz.i + 1} 問</span>
      <span class="streak">連続正解 <b id="streak">${quiz.streak}</b></span>
    </div>
    <div class="q-body">
      <div id="q-card">${cardHTML(card, { mystery: true, tag: "div", flipped: true })}</div>
      <div>
        <h2 class="q-ask">「？？？」に入る文法はどれ？</h2>
        <div class="choices">${choices.map((c, k) => `<button class="choice" data-no="${c.no}"><kbd>${k + 1}</kbd><span>${esc(c.title)}</span></button>`).join("")}</div>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>`;
  // 裏向きで配ってから表に返す
  requestAnimationFrame(() => requestAnimationFrame(() => $("#q-card .card")?.classList.remove("flipped")));
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.no)));
}

function answer(no) {
  if (quiz.answered) return;
  quiz.answered = true;
  const { card } = quiz.qs[quiz.i];
  const ok = no === card.no;
  quiz.results.push(ok);
  quiz.streak = ok ? quiz.streak + 1 : 0;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    const n = +b.dataset.no;
    if (n === card.no) b.classList.add("ok");
    else if (n === no) b.classList.add("ng");
    else b.classList.add("dim");
  });
  $("#q-card").innerHTML = cardHTML(card, { tag: "div" });
  $("#q-card .card").classList.add("pop");
  $("#streak").textContent = quiz.streak;
  const dot = document.querySelectorAll(".dots i")[quiz.i];
  dot.className = ok ? "ok" : "ng";
  const last = quiz.i === QN - 1;
  $("#verdict").innerHTML = `<strong class="${ok ? "yes" : "no"}">${ok ? "正解！" : "ざんねん"}</strong>
    ${ok ? "" : `<span class="best">正解は「${esc(card.title)}」</span>`}
    <button class="btn primary" id="q-next" style="margin-left:auto">${last ? "結果を見る" : "次の問題"}（Enter）</button>`;
  $("#q-next").addEventListener("click", nextQuestion);
  $("#q-next").focus({ preventScroll: true });
}

function nextQuestion() {
  if (quiz.i < QN - 1) { quiz.i++; renderQuestion(); return; }
  const n = quiz.results.filter(Boolean).length;
  const newBest = n > store.best;
  if (newBest) { store.best = n; store.save(); }
  const [title, msg] = rank(n);
  const missed = quiz.qs.filter((_, k) => !quiz.results[k]).map(q => q.card);
  $("#view-quiz").innerHTML = `
    <div class="result">
      <div class="score">${n}<small> / ${QN}</small></div>
      <div class="rank">${title}</div>
      <p>${msg}${newBest ? "　ベスト更新！" : ""}</p>
      <div class="row">
        <button class="btn primary" id="again">もう一度</button>
        <button class="btn" id="to-intro">デッキを選び直す</button>
        <a class="btn" href="#cards" style="text-decoration:none">図鑑へ</a>
      </div>
    </div>
    ${missed.length ? `<div class="missed"><div class="section-label">間違えたカード ・ タップで拡大</div>
      <div class="grid" id="missed">${missed.map(c => `<div class="slot">${cardHTML(c)}</div>`).join("")}</div></div>` : ""}`;
  $("#again").addEventListener("click", startQuiz);
  $("#to-intro").addEventListener("click", renderQuizIntro);
  const m = $("#missed");
  if (m) {
    attachTilt(m);
    m.addEventListener("click", e => {
      const card = e.target.closest(".card"); if (!card) return;
      openModal(missed, missed.findIndex(c => c.no === +card.dataset.no), false);
    });
  }
}

document.addEventListener("keydown", e => {
  if ($("#view-quiz").hidden || !$("#modal").hidden || e.target.tagName === "INPUT") return;
  if (!quiz.answered && /^[1-4]$/.test(e.key)) {
    const b = document.querySelectorAll(".choice")[+e.key - 1];
    if (b) b.click();
  } else if (quiz.answered && e.key === "Enter" && e.target.id !== "q-next") {
    $("#q-next")?.click();
  }
});

// ---------- 画面切り替え ----------
function route() {
  const isQuiz = location.hash === "#quiz";
  $("#view-cards").hidden = isQuiz;
  $("#view-quiz").hidden = !isQuiz;
  $("#tab-cards").toggleAttribute("aria-current", !isQuiz);
  $("#tab-quiz").toggleAttribute("aria-current", isQuiz);
  if (isQuiz) { $("#tab-quiz").setAttribute("aria-current", "page"); renderQuizIntro(); }
  else { $("#tab-cards").setAttribute("aria-current", "page"); renderAll(); }
  if (!$("#modal").hidden) $("#modal").hidden = true;
}
window.addEventListener("hashchange", route);
route();
</script>
